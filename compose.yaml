services:
  archivia-bollette:
    image: ghcr.io/shineofrider/archivia-bollette:latest
    container_name: archivia-bollette
    restart: unless-stopped
    init: true
    environment:
      TZ: "Europe/Rome"
      CONFIG_FILE: "/config/config.yaml"
      DATA_DIR: "/data"
      ARCHIVE_DIR: "/archive"
      IMAP_HOST: "${IMAP_HOST:-imap.gmail.com}"
      IMAP_PORT: "${IMAP_PORT:-993}"
      IMAP_USERNAME: "${IMAP_USERNAME:-}"
      IMAP_APP_PASSWORD: "${IMAP_APP_PASSWORD:-}"
      IMAP_FOLDER: "${IMAP_FOLDER:-INBOX}"
      POLL_INTERVAL: "${POLL_INTERVAL:-300}"
      HA_WEBHOOK_URL: "${HA_WEBHOOK_URL:-}"
      IREN_AUTOMATION_ENABLED: "${IREN_AUTOMATION_ENABLED:-false}"
      IREN_USERNAME: "${IREN_USERNAME:-}"
      IREN_PASSWORD: "${IREN_PASSWORD:-}"
      IREN_LOGIN_URL: "${IREN_LOGIN_URL:-https://clienti.irenyou.gruppoiren.it/}"
      IREN_USERNAME_SELECTOR: "${IREN_USERNAME_SELECTOR:-}"
      IREN_PASSWORD_SELECTOR: "${IREN_PASSWORD_SELECTOR:-input[type=password]}"
      IREN_SUBMIT_SELECTOR: "${IREN_SUBMIT_SELECTOR:-}"
      IREN_BILLS_URL: "${IREN_BILLS_URL:-}"
      IREN_DOWNLOAD_SELECTOR: "${IREN_DOWNLOAD_SELECTOR:-}"
      IREN_DEBUG_SCREENSHOT: "${IREN_DEBUG_SCREENSHOT:-false}"
      IREN_RETRY_SECONDS: "${IREN_RETRY_SECONDS:-21600}"
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: bind
        source: /srv/dev-disk-by-uuid-4f71b583-cef3-4261-ac1a-dad3a9057bb9/Documenti/Casa/Bollette
        target: /archive
    shm_size: "1gb"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
