services:
  archivia-bollette:
    image: ghcr.io/shineofrider/archivia-bollette:latest
    container_name: archivia-bollette
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Europe/Rome
      CONFIG_FILE: /config/config.yaml
      DATA_DIR: /data
      ARCHIVE_DIR: /archive
    volumes:
      - ./data:/data
      - /srv/dev-disk-by-uuid-4f71b583-cef3-4261-ac1a-dad3a9057bb9/Documenti/Casa/Bollette:/archive
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
