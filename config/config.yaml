mail:
  folder: INBOX
  poll_interval_seconds: 300
  lookback_days: 730

providers:
  alperia:
    sender: noreply@alperia.eu
    subject_regex: '^Nuova fattura disponibile Nr\.\s*.+$'
    archive_subdir: Corrente
  iren:
    sender: noreply@mail.clienti.irenyou.gruppoiren.it
    subject_exact: Emissione Bolletta
    archive_subdir: Gas

archive:
  filename_format: '{year:04d}_{month:02d}.pdf'
  collision_suffix: '_versione_{digest8}'
  fallback_to_email_month: true

gmail:
  host: imap.gmail.com
  port: 993

iren:
  login_url: https://clienti.irenyou.gruppoiren.it/
  headless: true
  navigation_timeout_ms: 45000
  download_timeout_ms: 45000

notifications:
  enabled: true

logging:
  level: INFO
